name: balance
on:
  push:
    paths: ['play/rules.js', 'text/gather.js', 'sim/text_sim.mjs', 'sim/zones.mjs', 'sim/zones-core.js', 'sim/balance_check.mjs']
  pull_request:
    paths: ['play/rules.js', 'text/gather.js', 'sim/text_sim.mjs', 'sim/zones.mjs', 'sim/zones-core.js', 'sim/balance_check.mjs']
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node sim/balance_check.mjs
